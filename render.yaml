services:
  - type: web
    name: canteen-backend
    runtime: docker
    rootDir: canteen-backend
    plan: free
    envVars:
      - key: PORT
        value: 8081

  - type: web
    name: canteen-frontend
    runtime: static
    rootDir: canteen-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
